server {
    listen 80;
    server_name _;

    # Mock Service — incoming mock requests
    location /mock/ {
        proxy_pass http://mock_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Admin Service — CRUD + Auth API
    location /api/ {
        proxy_pass http://admin_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Mock Service health/reload (internal — restrict in production)
    location /mock-service/ {
        proxy_pass http://mock_service/;
        proxy_set_header Host $host;
    }

    # Admin Service docs (dev only — disable in prod)
    location /admin-docs {
        proxy_pass http://admin_service/docs;
    }

    # Frontend — catch-all (must be last)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Support React Router client-side routing
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://frontend;
    }
}
