version: "3.9"

# ============================================================
# Minception — LOCAL DEVELOPMENT
# Usage: docker compose -f docker-compose.local.yml up --build
# ============================================================

services:

  mongodb:
    image: mongo:7
    container_name: minception-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_local:/data/db
    environment:
      MONGO_INITDB_DATABASE: api_gateway_dev
    networks:
      - minception_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-service:
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    container_name: minception-mock
    ports:
      - "8001:8001"
    environment:
      MONGO_URL: mongodb://mongodb:27017/api_gateway_dev
      MONGO_DEV_URL: mongodb://mongodb:27017/api_gateway_dev
      FASTAPI_ENV: development
      LOG_LEVEL: debug
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - minception_network
    volumes:
      - ./mock-service:/app          # hot reload
      - ./migrations:/app/migrations # migration runner access

    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: minception-admin
    ports:
      - "8002:8002"
    environment:
      MONGO_URL: mongodb://mongodb:27017/api_gateway_dev
      MONGO_DEV_URL: mongodb://mongodb:27017/api_gateway_dev
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: wajih.aslam@simpaisa.com
      ADMIN_PASSWORD: changeme123
      MOCK_SERVICE_URL: http://mock-service:8001
      FASTAPI_ENV: development
      LOG_LEVEL: debug
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - minception_network
    volumes:
      - ./admin-service:/app          # hot reload
      - ./migrations:/app/migrations  # migration runner access
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: minception-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:80
      ADMIN_SERVICE_URL: http://admin-service:8002
    depends_on:
      - admin-service
    networks:
      - minception_network
    volumes:
      - ./frontend:/app
      - /app/node_modules  # preserve node_modules in container

  nginx:
    image: nginx:1.24-alpine
    container_name: minception-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - mock-service
      - admin-service
      - frontend
    networks:
      - minception_network

volumes:
  mongo_data_local:
    driver: local

networks:
  minception_network:
    driver: bridge
