# ============================================================
# Minception — GitHub Actions CI/CD
# develop branch → auto deploy to staging
# main branch    → manual approval → deploy to production
# ============================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Tests (run on every PR and push) ──────────────────────
  test-mock-service:
    name: Test Mock Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mock-service/requirements.txt
      - run: pip install -r mock-service/requirements.txt --quiet
      - run: pytest app/tests/ -v --tb=short
        working-directory: mock-service

  test-admin-service:
    name: Test Admin Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: admin-service/requirements.txt
      - run: pip install -r admin-service/requirements.txt --quiet
      - run: pytest app/tests/ -v --tb=short
        working-directory: admin-service

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend

  # ── Build & Push Docker Images ────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-mock-service, test-admin-service, test-frontend]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          REGISTRY="${{ secrets.DOCKER_REGISTRY }}"

          docker build -t $REGISTRY/minception-mock:$IMAGE_TAG -f mock-service/Dockerfile mock-service/
          docker build -t $REGISTRY/minception-admin:$IMAGE_TAG -f admin-service/Dockerfile admin-service/
          docker build -t $REGISTRY/minception-frontend:$IMAGE_TAG -f frontend/Dockerfile frontend/

          docker tag $REGISTRY/minception-mock:$IMAGE_TAG $REGISTRY/minception-mock:latest
          docker tag $REGISTRY/minception-admin:$IMAGE_TAG $REGISTRY/minception-admin:latest
          docker tag $REGISTRY/minception-frontend:$IMAGE_TAG $REGISTRY/minception-frontend:latest

          docker push $REGISTRY/minception-mock:$IMAGE_TAG
          docker push $REGISTRY/minception-admin:$IMAGE_TAG
          docker push $REGISTRY/minception-frontend:$IMAGE_TAG
          docker push $REGISTRY/minception-mock:latest
          docker push $REGISTRY/minception-admin:latest
          docker push $REGISTRY/minception-frontend:latest

  # ── Deploy to Staging (develop branch only, auto) ────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_TAG="${IMAGE_TAG::8}"
            cd /opt/minception
            git pull origin develop
            export IMAGE_TAG=$IMAGE_TAG
            python -m migrations.runner --env staging
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d
            docker compose -f docker-compose.staging.yml exec -T mock-service curl -f http://localhost:8001/health
            docker compose -f docker-compose.staging.yml exec -T admin-service curl -f http://localhost:8002/health

  # ── Deploy to Production (main branch, manual approval) ──
  deploy-production:
    name: Deploy to Production (Manual Approval)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production        # requires manual approval in GitHub Environments
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_TAG="${IMAGE_TAG::8}"
            cd /opt/minception
            git pull origin main
            export IMAGE_TAG=$IMAGE_TAG
            python -m migrations.runner --env prod
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T mock-service curl -f http://localhost:8001/health
            docker compose -f docker-compose.prod.yml exec -T admin-service curl -f http://localhost:8002/health
